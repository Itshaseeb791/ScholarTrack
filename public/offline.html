<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5FAF7">
  <title>You're offline · Scholarship Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #F5FAF7; color: #163D2A; font: 16px/1.7 system-ui, sans-serif; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
    main { width: 100%; max-width: 440px; overflow-wrap: break-word; }
    h1 { font-size: 32px; letter-spacing: -1px; line-height: 1.2; }
    p { color: #587064; }
    button { min-height: 48px; border: 0; border-radius: 10px; background: #166534; color: #fff; padding: 12px 24px; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #166534; outline-offset: 4px; }
  </style>
  <script src="/offline.js" defer></script>
</head>
<body><main>
  <p>Scholarship Tracker</p>
  <h1>You're offline</h1>
  <p>Please reconnect to the internet to continue using Scholarship Tracker.</p>
  <button type="button" id="retry">Try again</button>
  <noscript><p>Reconnect, then refresh this page to try again.</p></noscript>
</main></body>
</html>
